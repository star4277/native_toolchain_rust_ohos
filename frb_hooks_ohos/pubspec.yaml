name: flutter_rust_bridge_hooks
description: Build hook support for flutter_rust_bridge Native Assets integration
version: 2.14.0-beta.2
repository: https://github.com/fzyzcjy/flutter_rust_bridge
environment:
  sdk: ">=3.9.2 <4.0.0"
resolution: workspace
dependencies:
  hooks:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_dart_native.git
      path: pkgs/hooks
      ref: flutter_3.47.7_deps
  logging: ^1.3.0
  meta: ^1.16.0
  native_toolchain_rust:
    path: ../native_toolchain_rust

dev_dependencies:
  flutter_lints: ^3.0.1
  test: ^1.24.0
