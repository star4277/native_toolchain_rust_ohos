name: native_toolchain_rust_workspace
repository: https://github.com/GregoryConrad/native_toolchain_rust
publish_to: none

environment:
  sdk: ^3.9.0

workspace:
  - native_toolchain_rust
  - examples/dart_only
  - examples/flutter
  - frb_hooks_ohos

dev_dependencies:
  # The OHOS fork's ffigen requires cli_util ^0.4.2; Melos >=7.8.2
  # requires cli_util ^0.5.0 or newer.
  melos: 7.8.1
  very_good_analysis: ^11.0.0

# Git dependencies' own overrides are ignored by Pub. Keep the native
# toolchain's transitive dependencies on the same OHOS fork and branch.
dependency_overrides:
  code_assets:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_dart_native.git
      path: pkgs/code_assets
      ref: flutter_3.47.7_deps
  hooks:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_dart_native.git
      path: pkgs/hooks
      ref: flutter_3.47.7_deps
  native_toolchain_c:
    git:
      url: https://gitcode.com/CPF-Flutter/fluttertpc_dart_native.git
      path: pkgs/native_toolchain_c
      ref: flutter_3.47.7_deps

melos:
  scripts:
    test:
      description: Run unit tests for a specific package in this project.
      packageFilters:
        dirExists: test
      exec:
        command: flutter test test
        concurrency: 1
        failFast: true

    integration-test:
      description: Run integration tests for a specific package in this project.
      packageFilters:
        dirExists: integration_test
      exec:
        command: flutter test integration_test
        concurrency: 1
        failFast: true

    init-integration-test-boilerplate:
      description: Create integration test boilerplate for a specific package in this project.
      packageFilters:
        dirExists: integration_test
      exec:
        command: flutter create .
        concurrency: 1
        failFast: true
